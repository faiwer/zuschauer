[package]
name = "zuschauer"
version = "0.1.0"
edition = "2024"

[dependencies]
humantime = "2.4.0"
json_comments = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
